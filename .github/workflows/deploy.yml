name: Build and publish static portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "index.html"
      - "assets/**"
      - "favicon.ico"
      - "robots.txt"
      - "_headers"
      - ".nojekyll"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "portfolio-static-build"
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build

      - name: Verify generated homepage and custom favicon
        run: |
          test -s .output/public/index.html
          grep -q '/portfolio-minimal/assets/' .output/public/index.html
          grep -q '/portfolio-minimal/favicon.svg' .output/public/index.html
          ! grep -qi 'favicon.ico' .output/public/index.html
          test -s .output/public/favicon.svg
          test -n "$(find .output/public/assets -maxdepth 1 -name '*.css' -print -quit)"

      - name: Publish generated files to the Pages source branch
        run: |
          rm -rf assets
          rm -f favicon.ico
          cp -a .output/public/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A -- index.html assets favicon.ico favicon.svg robots.txt _headers .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish compiled portfolio [skip pages]"
            git push origin HEAD:main
          fi
